name: Build Windows EXE

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw81'

      - name: Build project
        run: |
          qmake freeM.pro
          mingw32-make release

      - name: Upload EXE
        uses: actions/upload-artifact@v3
        with:
          name: freeM-exe
          path: release/
